<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente Escolar</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 16px;background:#f6f8fb;color:#172033}textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #bcc5d4}textarea{width:100%;box-sizing:border-box;min-height:100px}button{margin-top:10px;background:#2457c5;color:#fff;border:0;cursor:pointer}#answer{white-space:pre-wrap;background:#fff;padding:18px;border-radius:10px;margin-top:20px}</style></head><body><h1>Assistente Virtual de Gestão Escolar</h1><p>Como posso ajudar com alunos, turmas, notas, frequência, financeiro ou relatórios?</p><textarea id="message" placeholder="Ex.: Como cadastro um aluno?"></textarea><br><button onclick="send()">Perguntar</button><div id="answer"></div><script>async function send(){const m=document.querySelector('#message').value;const r=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});const d=await r.json();document.querySelector('#answer').textContent=d.reply||d.detail||'Erro ao consultar o agente.'}</script></body></html>
