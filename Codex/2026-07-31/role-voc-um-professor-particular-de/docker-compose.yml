services:
  programming-tutor:
    build: .
    env_file: .env
    ports:
      # Loopback binding avoids exposing a teaching/ERP endpoint to the LAN.
      - "127.0.0.1:${HOST_PORT:-8017}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
